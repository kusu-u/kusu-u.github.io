<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Floating Panel</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="panel" onclick="openFile('foo.md')">
            <h2>Hover over me</h2>
            <p>This is a floating panel that moves up on hover</p>
        </div>
    </div>
    <script>
        function openFile(filePath) {
            window.open(filePath, '_blank');
        }
    </script>
</body>
</html>
